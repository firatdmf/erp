# Build the database from nothing, then run the suites against it.
#
# The from-scratch build is the point. Production applies migrations one
# at a time against a database that already holds everything before them,
# so an ordering the graph never actually required can look correct for
# months. marketing/0080 renamed the email_automation tables seven months
# after they were created and never declared the dependency; operating/0076
# did the same to procurement. Both were invisible everywhere except a
# database built from empty — which nothing did, because there was no CI
# and the operating suite could not run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches production (Railway reports PostgreSQL 18.6).
        image: postgres:18
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # settings.py reads these through python-decouple, which falls back
      # to the environment when there is no .env file. Every one of them
      # is required — config() raises without a default.
      SECRET_KEY: ci-not-a-real-secret
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: erp
      DB_USER: erp
      DB_PASSWORD: erp
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SCHEMA: public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to erp/runtime.txt, which is what Railway builds with.
          python-version: "3.12.1"
          cache: pip
          cache-dependency-path: erp/requirements.txt

      - name: Install system libraries
        # WeasyPrint links against these at import time; the same list
        # railpack.json installs for the deploy.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install Python dependencies
        run: pip install -r erp/requirements.txt

      - name: Migrate a database built from nothing
        # The guard. An undeclared cross-app dependency fails here and
        # nowhere else.
        working-directory: erp
        run: python manage.py migrate --no-input

      - name: Check no migration is left unapplied
        working-directory: erp
        run: python manage.py migrate --check

      - name: Check no model change is missing a migration
        working-directory: erp
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        # accounting takes the app label; operating's modules are named
        # one by one because a bare directory label makes unittest import
        # them as top-level modules, which breaks their relative imports
        # ("attempted relative import with no known parent package").
        # Worth untangling separately — listing them keeps CI honest in
        # the meantime rather than quietly skipping nine modules.
        working-directory: erp
        run: |
          python manage.py test accounting --no-input
          python manage.py test $(ls operating/test*.py \
            | sed 's|operating/||; s|\.py$||; s|^|operating.|' | tr '\n' ' ') \
            --no-input
