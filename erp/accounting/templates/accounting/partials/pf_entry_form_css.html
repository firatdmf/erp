{% comment %}
  The pf-* entry-form styles: the expense and dividend pages. Both are the
  same kind of page (a funding source, the entry, a summary beside it), so
  they share one copy of the look rather than two that drift apart.
{% endcomment %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --nejum-teal-50:  #E5F1F0;
    --nejum-teal-500: #147F74;
    --nejum-teal-600: #00696A;
    --nejum-teal-700: #005354;
    --gray-400: #A0A8B0;
    --gray-500: #6B7280;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --font-sans: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --ink: #0F1419;
  }
  .pf { padding: 22px 28px 100px; font: 400 13.5px var(--font-sans); color: var(--ink); max-width: 1280px; margin: 0 auto; }
  .pf, .pf * { box-sizing: border-box; }

  .pf-back { display:inline-flex; align-items:center; gap:6px; padding: 6px 12px; background: white; border: 1px solid #E0E6EE; border-radius: 8px; font: 600 12.5px var(--font-sans); color: var(--gray-700); text-decoration: none; box-shadow: 0 1px 2px rgba(15,23,31,0.04); margin-bottom: 14px; transition: all 140ms; }
  .pf-back:hover { border-color: var(--nejum-teal-500); color: var(--nejum-teal-700); }

  .pf-head { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom: 22px; gap: 16px; }
  .pf-eyebrow { font: 700 10.5px var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--nejum-teal-600); margin-bottom: 4px; }
  .pf-title { font: 800 28px var(--font-sans); letter-spacing: -0.02em; color: var(--ink); margin: 0; }

  .pf-grid { display:grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: flex-start; }
  @media (max-width: 1100px) { .pf-grid { grid-template-columns: 1fr; } }

  .pf-card { background: white; border: 1px solid #E2E8EE; border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,31,0.03); overflow: visible; }
  .pf-card + .pf-card { margin-top: 14px; }
  .pf-sect { padding: 18px 22px; }
  .pf-sect + .pf-sect { border-top: 1px solid #EEF1F5; }
  .pf-sect-h { display:flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .pf-sect-h .ico { display:inline-flex; align-items:center; justify-content:center; width: 28px; height: 28px; border-radius: 8px; background: var(--nejum-teal-50); color: var(--nejum-teal-700); font-size: 13px; }
  .pf-sect-h h3 { font: 700 14px var(--font-sans); color: var(--ink); margin: 0; letter-spacing: -0.01em; }
  .pf-sect-h .sub { font: 500 12px var(--font-sans); color: var(--gray-500); margin-left: 4px; }

  .pf-btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding: 9px 16px; border-radius: 10px; font: 600 13px var(--font-sans); cursor: pointer; transition: all 140ms; white-space: nowrap; text-decoration: none; border: none; }
  .pf-btn.ghost { background: white; border:1px solid #E0E6EE; color: var(--gray-700); box-shadow: 0 1px 2px rgba(15,23,31,0.04); }
  .pf-btn.ghost:hover { background:#F8FAFC; border-color:#C5CCD3; }
  .pf-btn.primary { background: linear-gradient(180deg, var(--nejum-teal-500), var(--nejum-teal-600)); border: 1px solid var(--nejum-teal-700); color: white; box-shadow: 0 1px 2px rgba(15,23,31,0.10), inset 0 1px 0 rgba(255,255,255,0.18); }
  .pf-btn.primary:hover { filter: brightness(1.04); color: white; }

  .pf-row { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px 16px; }
  .pf-row.four { grid-template-columns: 1.2fr .8fr 1fr 1.2fr; }
  @media (max-width: 980px) { .pf-row.four { grid-template-columns: 1fr 1fr; } }
  .pf-row.two { grid-template-columns: 1fr 1fr; }
  .pf-row.wide { grid-template-columns: 1fr; }
  .pf-row + .pf-row { margin-top: 14px; }
  @media (max-width: 720px) { .pf-row, .pf-row.two { grid-template-columns: 1fr; } }

  .pf-f { display:flex; flex-direction: column; gap: 6px; }
  .pf-f label { font: 600 11.5px var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--gray-600); }
  .pf-f .hint { font: 400 11.5px var(--font-sans); color: var(--gray-500); margin-top: 2px; }
  .pf-f input, .pf-f select, .pf-f textarea {
    width: 100%; padding: 10px 12px; background: white; border: 1px solid #E0E6EE; border-radius: 8px;
    font: 500 13px var(--font-sans); color: var(--ink); outline: none; transition: all 140ms;
    font-family: var(--font-sans);
  }
  .pf-f input:focus, .pf-f select:focus, .pf-f textarea:focus {
    border-color: var(--nejum-teal-500); box-shadow: 0 0 0 3px rgba(20,127,116,0.12); background: white;
  }
  .pf-f input[type=date], .pf-f input[type=number] { font-variant-numeric: tabular-nums; }
  .pf-f select[disabled] { background: #F5F7FA; color: var(--gray-600); cursor: not-allowed; }

  /* Errors */
  .pf-err { display:flex; gap:10px; align-items:flex-start; background: #FEF2F2; border: 1px solid #FCA5A5; color: #7F1D1D; border-radius: 10px; padding: 12px 14px; font: 500 12.5px var(--font-sans); margin-bottom: 16px; }
  .pf-err ul { margin: 0; padding-left: 18px; }

  /* Funding-source toggle — the model allows exactly one, so the control
     offers exactly one. Radios, not JS state: the browser already enforces
     "pick one of these", and a radio group survives a failed submit. */
  .pf-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  @media (max-width: 720px) { .pf-seg { grid-template-columns: 1fr; } }
  .pf-seg label {
    display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
    border: 1px solid #E0E6EE; border-radius: 10px; padding: 12px 14px; background: white;
    transition: all 140ms;
  }
  .pf-seg label:hover { border-color: #C5CCD3; background: #F8FAFC; }
  .pf-seg input { margin: 2px 0 0; accent-color: var(--nejum-teal-500); flex: 0 0 auto; }
  .pf-seg .t { font: 700 13px var(--font-sans); color: var(--ink); display: block; }
  .pf-seg .d { font: 500 11.5px var(--font-sans); color: var(--gray-500); display: block; margin-top: 3px; line-height: 1.45; }
  .pf-seg label:has(input:checked) { border-color: var(--nejum-teal-500); background: var(--nejum-teal-50); box-shadow: 0 0 0 3px rgba(20,127,116,0.10); }
  .pf-fund[hidden] { display: none; }

  /* Account type-to-search + chip — lifted verbatim from the goods-receipt
     page so the two pickers are the same control, not two that resemble
     each other. */
  .np-sup { position: relative; }
  .np-sup-results {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40;
    background: #fff; border: 1px solid #DDE3EA; border-radius: 10px;
    box-shadow: 0 10px 26px rgba(15,20,25,.13); max-height: 236px; overflow-y: auto; padding: 4px;
  }
  .np-sup-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 10px; border-radius: 7px; cursor: pointer;
    font: 600 13px var(--font-sans); color: #0F1419;
  }
  .np-sup-opt:hover, .np-sup-opt.active { background: #EFF6F5; }
  .np-sup-opt .pfx { font: 700 10.5px var(--font-mono); color: #A9852F; letter-spacing: .5px;
                     background: #FDF6E7; border: 1px solid #F2E2BC; border-radius: 5px; padding: 2px 6px; }
  .np-sup-empty { padding: 9px 10px; font: 500 12.5px var(--font-sans); color: var(--gray-500); }
  .np-sup-chip {
    display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 12px;
    border: 1px solid #BFE0DB; background: #EFF6F5; border-radius: 9px;
    font: 700 13.5px var(--font-sans); color: #0B5F60;
  }
  .np-sup-chip > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Drawn, not typed: a "×" glyph is baseline-aligned, so it never lands in
     the middle of its box. */
  .np-sup-clear {
    flex: 0 0 auto; width: 24px; height: 24px; border: 0; border-radius: 6px; cursor: pointer;
    background: transparent; color: #0B5F60; padding: 0; position: relative;
    font-size: 0; line-height: 0;
  }
  .np-sup-clear::before, .np-sup-clear::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 11px; height: 1.8px;
    background: currentColor; border-radius: 2px;
  }
  .np-sup-clear::before { transform: translate(-50%, -50%) rotate(45deg); }
  .np-sup-clear::after  { transform: translate(-50%, -50%) rotate(-45deg); }
  .np-sup-clear:hover { background: #DCEBE9; }
  /* An author `display` beats the UA sheet's [hidden] rule, so the chip has
     to opt back out explicitly or it shows up empty before an account is
     picked. */
  .np-sup-chip[hidden] { display: none; }
  .np-input {
    width: 100%; height: 40px; box-sizing: border-box;
    padding: 0 12px; border: 1px solid #DDE3EA; border-radius: 9px;
    background: white; font: 500 13.5px var(--font-sans); color: #0F1419; outline: none;
    transition: border-color 140ms, box-shadow 140ms;
  }
  .np-input:focus { border-color: var(--nejum-teal-500); box-shadow: 0 0 0 3px rgba(20,127,116,0.12); }

  /* Summary */
  .pf-sum .row { display:flex; justify-content: space-between; align-items:center; padding: 9px 0; border-bottom: 1px dashed #E7ECF2; font: 500 13px var(--font-sans); }
  .pf-sum .row:last-child { border-bottom: none; }
  .pf-sum .lbl { color: var(--gray-600); }
  .pf-sum .val { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
  .pf-sum .row.grand { border-top: 1px solid #E2E8EE; margin-top: 6px; padding-top: 12px; }
  .pf-effect { margin-top: 14px; background: #F8FAFC; border: 1px solid #E7ECF2; border-radius: 10px; padding: 12px 14px; font: 500 12.5px var(--font-sans); color: var(--gray-600); line-height: 1.55; }
  .pf-effect b { color: var(--ink); }
  .pf-actions { margin-top: 16px; display: grid; gap: 8px; }
  .pf-btn.danger { background: white; border: 1px solid #F0C4C4; color: #B23B12; margin-top: 6px; }
  .pf-btn.danger:hover { background: #FEF4F2; border-color: #E4A4A4; }
  .pf-posted { margin-top: 10px; background: var(--nejum-teal-50); border: 1px solid rgba(20,127,116,0.18); border-radius: 10px; padding: 12px 14px; }
  .pf-posted .t { font: 700 10.5px var(--font-sans); letter-spacing: .1em; text-transform: uppercase; color: var(--nejum-teal-700); margin-bottom: 5px; }
  .pf-posted a { font: 700 13px var(--font-sans); color: var(--ink); text-decoration: none; }
  .pf-posted a:hover { color: var(--nejum-teal-700); text-decoration: underline; }
  .pf-posted .n { font: 500 12px var(--font-sans); color: var(--gray-600); margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* The rate converter that partials/fx_rate_field.html appends, dressed to
     match the payment form's version of the same control. */
  .fx-extra { display: grid; grid-template-columns: auto 1.4fr auto; gap: 8px; align-items: center; margin-top: 8px; }
  .fx-extra .fx-eq { color: var(--gray-500); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .fx-extra .fx-total { width: 100%; padding: 10px 12px; border: 1px solid #E0E6EE; border-radius: 8px; font: 500 13px var(--font-sans); font-variant-numeric: tabular-nums; outline: none; }
  .fx-extra .fx-total:focus { border-color: var(--nejum-teal-500); box-shadow: 0 0 0 3px rgba(20,127,116,0.12); }
  .fx-extra .fx-code { display: none; }
  .fx-extra .fx-reset { border: 1px solid #D7DFE8; background: #fff; border-radius: 8px; padding: .55rem .7rem; font: 600 11.5px var(--font-sans); color: #46546A; cursor: pointer; white-space: nowrap; }
  .fx-extra .fx-reset:hover { border-color: #B9C6D4; }
  .fx-extra .fx-note { grid-column: 1 / -1; font: 400 11.5px var(--font-sans); color: var(--gray-500); }
  @media (max-width: 720px) { .fx-extra { grid-template-columns: 1fr; } }
</style>
