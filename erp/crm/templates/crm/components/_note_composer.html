{% load i18n %}
{% comment %}
  The always-open note box at the top of a record's History card.
  Saving re-renders the history under it (noteComposerSaved, in
  crm/js/record_detail.js).

  Expects: add_note_url, record_name.
{% endcomment %}
<div class="od-note-composer">
  <form id="noteComposerForm" class="od-note-form"
        hx-post="{{ add_note_url }}"
        hx-swap="none"
        hx-on::after-request="if(event.detail.successful) { noteComposerSaved(); }">
    {% csrf_token %}
    <textarea name="content" id="noteComposerInput" class="od-note-input" rows="3"
              placeholder="{% blocktrans with name=record_name|capfirst %}Enter a note about {{ name }}{% endblocktrans %}"
              oninput="syncNoteComposer(this)"
              onkeydown="if((event.metaKey || event.ctrlKey) && event.key === 'Enter') { event.preventDefault(); if (this.value.trim()) this.form.requestSubmit(); }"></textarea>
    <div class="od-note-actions">
      <button type="submit" class="ord-btn primary" id="noteComposerSubmit" disabled>
        <i class="fa fa-check"></i>{% trans "Save note" %}
      </button>
      <span class="od-note-hint">{% trans "Ctrl + Enter to save" %}</span>
    </div>
  </form>
</div>
