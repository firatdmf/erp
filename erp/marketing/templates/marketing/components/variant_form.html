{% load i18n %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'marketing/css/components/variant_form.css' %}?v=4" />
{% endblock css %}

<div class="loading" id="loading">{% trans "Loading…" %}</div>

<!-- Initial: Show only Add Variants button -->
<div id="add_variant_trigger" style="margin: 20px 0;">
  <button type="button" class="add_another_option" onclick="showVariantSection()" style="border: 1.5px dashed #667eea;">
    <i class="fa fa-plus"></i> {% trans "Add Product Variants" %}
  </button>
</div>

<!-- Variant Options Section (initially hidden) -->
<div class="variant_component" id="variant_component" style="display: none;">
  <div class="variant_options_wrapper">
    <div id="variant_options_list"></div>
    <button type="button" class="add_option_button" onclick="addNewOption()">
      <i class="fa fa-plus-circle"></i> {% trans "Add another option" %}
    </button>
  </div>

  <!-- Hidden select for compat -->
  <select id="grouping_select" style="display:none;" onchange="filterVariantTableByGroup()"></select>

  <!-- Shopify-style grouping popover -->
  <div class="grp" id="grp_container" style="display: none;">
    <span class="grp_label">{% trans "Grouping by" %}</span>
    <div class="grp_trigger_wrap">
      <button type="button" class="grp_trigger" id="grp_trigger" onclick="toggleGroupingPopover()">
        <span id="grp_selected_text">—</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="grp_popover" id="grp_popover">
        <div class="grp_options" id="grp_options"></div>
      </div>
    </div>
  </div>

  <!-- Scrollable Table Wrapper for Mobile -->
  <div id="variant_table_wrapper"
    style="width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;">
    <table id="variant_table" style="width: 100%; min-width: 500px; border-collapse: collapse;"></table>
  </div>

  <!-- The table lists the variants there are; new ones are added here. -->
  <div class="variant_rows_actions" id="variant_rows_actions" style="display: none;">
    <button type="button" class="variant_rows_btn" onclick="addVariantRow()">
      <i class="fa fa-plus"></i> {% trans "Add variant" %}
    </button>
    <button type="button" class="variant_rows_btn" onclick="createEveryCombination()"
            title="{% trans 'Adds a variant for each combination of the values above that is not a variant yet.' %}">
      <i class="fa fa-th"></i> {% trans "Create every combination" %}
    </button>
    <span class="variant_rows_note" id="variant_rows_note"></span>
  </div>

  <!-- Hidden input for tracking deleted variant files -->
  <input type="hidden" id="deleted_variant_files" name="deleted_variant_files" value="">

  {% comment %} <p>{{message}}</p> {% endcomment %}
  <script>
    // i18n strings for the dynamically-generated variant UI
    window.VARIANT_T = window.VARIANT_T || {
      // table headers
      photo:           '{% trans "PHOTO"|escapejs %}',
      price:           '{% trans "PRICE"|escapejs %}',
      stock:           '{% trans "STOCK"|escapejs %}',
      featured:        '{% trans "FEATURED"|escapejs %}',
      attributes:      '{% trans "ATTRIBUTES"|escapejs %}',
      // option editor
      option_name:     '{% trans "Option name"|escapejs %}',
      option_values:   '{% trans "Option values"|escapejs %}',
      option_placeholder: '{% trans "e.g. Size, Color"|escapejs %}',
      add_value:       '{% trans "Add another value"|escapejs %}',
      delete:          '{% trans "Delete"|escapejs %}',
      // table row
      edit_hint:       '{% trans "Edit"|escapejs %}',
      // adding variants, and rows the save can't take
      no_rows_yet:     '{% trans "No variants yet — add one, or create every combination of the values above."|escapejs %}',
      every_combination_exists: '{% trans "Every combination is already a variant."|escapejs %}',
      confirm_combinations: '{% trans "This adds %(count)s variants. Continue?"|escapejs %}',
      row_without_values: '{% trans "A new variant has no values — pick them, or delete the row."|escapejs %}',
      rows_alike:      '{% trans "Two variants have the same values: %(values)s — change one, or delete it."|escapejs %}',
      rows_title:      '{% trans "Check the variants"|escapejs %}',
      // variant attributes modal
      m_title:         '{% trans "Variant Attributes"|escapejs %}',
      m_help:          '{% trans "Customize attributes for this specific variant. Leave empty to use product-level defaults."|escapejs %}',
      m_variant_label: '{% trans "Variant"|escapejs %}',
      m_attribute:     '{% trans "Attribute"|escapejs %}',
      m_default:       '{% trans "Default"|escapejs %}',
      m_variant_value: '{% trans "Variant value"|escapejs %}',
      m_empty:         '{% trans "No product-level attributes defined. Add attributes in the Product Attributes section above."|escapejs %}',
      m_cancel:        '{% trans "Cancel"|escapejs %}',
      m_save:          '{% trans "Save"|escapejs %}',
      m_saved:         '{% trans "Attributes saved for variant"|escapejs %}',
      // common option-name translations (lowercase keys, uppercased on render)
      opt_labels: {
        'color':   '{% trans "COLOR"|escapejs %}',
        'colour':  '{% trans "COLOR"|escapejs %}',
        'size':    '{% trans "SIZE"|escapejs %}',
        'material':'{% trans "MATERIAL"|escapejs %}',
        'style':   '{% trans "STYLE"|escapejs %}',
        'pattern': '{% trans "PATTERN"|escapejs %}',
        'length':  '{% trans "LENGTH"|escapejs %}',
        'width':   '{% trans "WIDTH"|escapejs %}',
        'height':  '{% trans "HEIGHT"|escapejs %}',
        'weight':  '{% trans "WEIGHT"|escapejs %}',
      },
    };

    // Show variant section when button is clicked
    function showVariantSection() {
      document.getElementById('add_variant_trigger').style.display = 'none';
      document.getElementById('variant_component').style.display = 'block';
    }

    // Set window variables FIRST
    window.my_message = "{{ message }}";
    window.product_variant_list_data = '{{ product_variant_list }}';
    window.product_variant_options_data = '{{ product_variant_options }}';
    window.variant_files_json_data = '{{ variant_files_json }}';
    window.product_attributes_data = '{{ product_attributes }}';
    window.attribute_value_images_data = '{{ attribute_value_images }}';

    // Debug logs
    console.log('Variant form loaded');
    console.log('product_variant_list_data:', window.product_variant_list_data);
    console.log('product_variant_options_data:', window.product_variant_options_data);
    console.log('product_attributes_data:', window.product_attributes_data);

    // If editing and variants exist, show variant section automatically
    if (window.product_variant_list_data && window.product_variant_list_data !== '[]' && window.product_variant_list_data !== '') {
      console.log('Showing variant section because variants exist');
      showVariantSection();
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    // A static script cannot reach the catalogue, so its words come from here.
    window.VF_TEXT = {
      deleteImageTitle: '{% filter escapejs %}{% trans "Delete the image?" %}{% endfilter %}',
      deleteImageBody: '{% filter escapejs %}{% trans "This image will be deleted permanently. This cannot be undone." %}{% endfilter %}',
      delete: '{% filter escapejs %}{% trans "Delete" %}{% endfilter %}',
      cancel: '{% filter escapejs %}{% trans "Cancel" %}{% endfilter %}',
      deleteFailed: '{% filter escapejs %}{% trans "The delete failed" %}{% endfilter %}',
      imageDeleted: '{% filter escapejs %}{% trans "Image deleted!" %}{% endfilter %}',
      deleteError: '{% filter escapejs %}{% trans "Delete error" %}{% endfilter %}'
    };
  </script>
  <script src="{% static 'marketing/js/variant_form_modern.js' %}?v=7" defer></script>
  <script src="{% static 'marketing/js/variant_attributes_modal.js' %}?v=2" defer></script>
</div>
